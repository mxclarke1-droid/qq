/* =========================================================
   SANTA MODEL
========================================================= */

let santaModel = null;

let trackingStarted = false;

const MODEL_FILE = "santa.gltf";


/*
    IMPORTANT:

    The model is loaded after Globe.gl has created
    its Three.js scene.

    We also check that the returned scene exists before
    trying to insert the model.
*/

function loadSantaModel(){

    modelNotice.style.display = "block";

    modelNotice.textContent =
        "🎅 Loading santa.gltf...";

    const loader =
        new THREE.GLTFLoader();

    const modelURL =
        "./" + MODEL_FILE;

    loader.load(

        modelURL,

        function(gltf){

            console.log(
                "🎅 santa.gltf successfully loaded!"
            );

            santaModel =
                gltf.scene;

            /*
                Start with the model hidden.
                It becomes visible when tracking starts.
            */

            santaModel.visible =
                trackingStarted;

            /*
                Scale the model.
                We will adjust this if necessary.
            */

            santaModel.scale.set(
                0.08,
                0.08,
                0.08
            );


            /*
                Prevent objects from disappearing
                because of camera frustum calculations.
            */

            santaModel.traverse(function(object){

                if(object.isMesh){

                    object.frustumCulled = false;

                    if(object.material){

                        object.material.needsUpdate = true;

                    }

                }

            });


            /*
                SAFER SCENE INSERTION
            */

            try{

                const scene =
                    globe.scene();

                if(!scene){

                    throw new Error(
                        "Globe scene was not available."
                    );

                }


                /*
                    Make sure the object really is
                    a Three.js Object3D.
                */

                if(!santaModel.isObject3D){

                    throw new Error(
                        "The loaded Santa model is not a valid Three.js Object3D."
                    );

                }


                scene.add(santaModel);


                console.log(
                    "🎅 Santa model successfully added to Globe.gl scene."
                );


                modelNotice.textContent =
                    "🎅 Santa's sleigh loaded!";


                setTimeout(function(){

                    modelNotice.style.display =
                        "none";

                },3000);

            }

            catch(error){

                console.error(
                    "Could not add Santa to globe:",
                    error
                );

                modelNotice.style.display =
                    "block";

                modelNotice.textContent =
                    "⚠️ Santa loaded, but scene placement failed: " +
                    (
                        error && error.message
                        ? error.message
                        : error
                    );

            }

        },

        function(progress){

            if(progress.total){

                const percent =
                    Math.round(
                        progress.loaded /
                        progress.total *
                        100
                    );

                modelNotice.textContent =
                    "🎅 Loading Santa... " +
                    percent +
                    "%";

            }

        },

        function(error){

            console.error(
                "Error loading santa.gltf:",
                error
            );

            modelNotice.style.display =
                "block";

            modelNotice.textContent =
                "⚠️ santa.gltf could not be loaded. Make sure santa.gltf is uploaded beside index.html.";

        }

    );

}


/*

/* =========================================================
   GREAT CIRCLE ROUTING
========================================================= */

function interpolateGreatCircle(
    start,
    end,
    fraction
){

    const lat1 =
        start.lat *
        Math.PI / 180;

    const lon1 =
        start.lng *
        Math.PI / 180;

    const lat2 =
        end.lat *
        Math.PI / 180;

    const lon2 =
        end.lng *
        Math.PI / 180;


    const a = {

        x:
            Math.cos(lat1) *
            Math.cos(lon1),

        y:
            Math.cos(lat1) *
            Math.sin(lon1),

        z:
            Math.sin(lat1)

    };


    const b = {

        x:
            Math.cos(lat2) *
            Math.cos(lon2),

        y:
            Math.cos(lat2) *
            Math.sin(lon2),

        z:
            Math.sin(lat2)

    };


    const dot =
        a.x*b.x +
        a.y*b.y +
        a.z*b.z;


    const angle =
        Math.acos(
            Math.min(
                1,
                Math.max(-1,dot)
            )
        );


    if(angle < 0.0001){

        return {

            lat:
                start.lat +
                (end.lat-start.lat) *
                fraction,

            lng:
                start.lng +
                (end.lng-start.lng) *
                fraction

        };

    }


    const sinAngle =
        Math.sin(angle);


    const A =
        Math.sin(
            (1-fraction)*angle
        ) /
        sinAngle;


    const B =
        Math.sin(
            fraction*angle
        ) /
        sinAngle;


    const x =
        A*a.x +
        B*b.x;

    const y =
        A*a.y +
        B*b.y;

    const z =
        A*a.z +
        B*b.z;


    return {

        lat:
            Math.atan2(
                z,
                Math.sqrt(
                    x*x+y*y
                )
            ) *
            180 /
            Math.PI,

        lng:
            Math.atan2(
                y,
                x
            ) *
            180 /
            Math.PI

    };

}

        {name:"Vancouver",lat:49.2827,lng:-123.1207},

        {name:"Chicago",lat:41.8781,lng:-87.6298}

    ];


    /*
        Shuffle stops.
    */

    possibleStops.sort(
        () => Math.random() - 0.5
    );


    /*
        Take seven random stops.
    */

    const selectedStops =
        possibleStops.slice(0,7);


    route = [

        {
            name:"North Pole",
            lat:90,
            lng:0
        },

        ...selectedStops,

        {
            name:selectedState,
            lat:destination[0],
            lng:destination[1]
        }

    ];


    routeIndex = 0;

}


/* =========================================================
   START TRACKING
========================================================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function(){

            generateRoute();

            trackingStarted = true;

            statusText.textContent =
                "Santa is flying! 🎅";

            countdownText.textContent =
                "Santa is on the move!";

            if(santaModel){

                santaModel.visible =
                    true;

            }

            routeIndex = 0;

            segmentStartTime =
                performance.now();

            locationText.textContent =
                route[0].name;

            destinationText.textContent =
                stateSelect.value;

            animateSanta();

        }
    );


/* =========================================================
   SANTA ANIMATION
========================================================= */

function animateSanta(){

    if(!trackingStarted){

        return;

    }


    if(!santaModel){

        requestAnimationFrame(
            animateSanta
        );

        return;

    }


    if(routeIndex >= route.length-1){

        const finalStop =
            route[route.length-1];

        const coords =
            globe.getCoords(
                finalStop.lat,
                finalStop.lng,
                .20
            );


        santaModel.position.set(
            coords.x,
            coords.y,
            coords.z
        );


        locationText.textContent =
            finalStop.name;


        statusText.textContent =
            "Santa has arrived! 🎅🎄";

        countdownText.textContent =
            "ARRIVED!";


        return;

    }


    const start =
        route[routeIndex];

    const end =
        route[routeIndex+1];


    const now =
        performance.now();


    let fraction =
        (
            now -
            segmentStartTime
        ) /
        SEGMENT_DURATION;


    if(fraction >= 1){

        routeIndex++;

        segmentStartTime =
            now;

        fraction = 0;

    }


    const position =
        interpolateGreatCircle(
            start,
            end,
            fraction
        );


    locationText.textContent =
        start.name +
        " → " +
        end.name;


    /*
        Put Santa ABOVE the Earth.
    */

    const coords =
        globe.getCoords(
            position.lat,
            position.lng,
            .20
        );


    /*
        Small flying/bobbing movement.
    */

    const bob =
        Math.sin(
            now / 250
        ) * .015;


    santaModel.position.set(
        coords.x,
        coords.y,
        coords.z + bob
    );


    /*
        Point Santa toward the next
        section of the route.
    */

    const nextFraction =
        Math.min(
            1,
            fraction + .02
        );


    const nextPosition =
        interpolateGreatCircle(
            start,
            end,
            nextFraction
        );


    const nextCoords =
        globe.getCoords(
            nextPosition.lat,
            nextPosition.lng,
            .20
        );


    const dx =
        nextCoords.x -
        coords.x;

    const dy =
        nextCoords.y -
        coords.y;

    const dz =
        nextCoords.z -
        coords.z;


    if(
        Math.abs(dx) +
        Math.abs(dy) +
        Math.abs(dz)
        > 0.00001
    ){

        const direction =
            new THREE.Vector3(
                dx,
                dy,
                dz
            ).normalize();


        const up =
            new THREE.Vector3(
                coords.x,
                coords.y,
                coords.z
            ).normalize();


        const right =
            new THREE.Vector3()
            .crossVectors(
                direction,
                up
            )
            .normalize();


        const correctedUp =
            new THREE.Vector3()
            .crossVectors(
                right,
                direction
            )
            .normalize();


        const matrix =
            new THREE.Matrix4();


        matrix.makeBasis(
            right,
            correctedUp,
            direction
        );


        santaModel.quaternion
            .setFromRotationMatrix(
                matrix
            );

    }


    requestAnimationFrame(
        animateSanta
    );

}

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(){

    const selectedState =
        stateSelect.value;

    const time =
        document
        .getElementById("arrivalTime")
        .value;


    if(!time){

        return;

    }


    const parts =
        time.split(":");


    const target =
        new Date();


    target.setHours(
        parseInt(parts[0]),
        parseInt(parts[1]),
        0,
        0
    );


    const now =
        new Date();


    if(target < now){

        target.setDate(
            target.getDate()+1
        );

    }


    const difference =
        target.getTime() -
        now.getTime();


    const hours =
        Math.floor(
            difference /
            (1000*60*60)
        );


    const minutes =
        Math.floor(
            (
                difference %
                (1000*60*60)
            ) /
            (1000*60)
        );


    const seconds =
        Math.floor(
            (
                difference %
                (1000*60)
            ) /
            1000
        );


    if(!trackingStarted){

        countdownText.textContent =
            "Arrival in " +
            hours + "h " +
            minutes + "m " +
            seconds + "s";

    }

}


setInterval(
    updateCountdown,
    1000
);
